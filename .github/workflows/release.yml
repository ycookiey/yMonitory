name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          if not exist build mkdir build
          rc /fo build\yMonitory.res src\yMonitory.rc
          cl /nologo /W4 /O2 /MT /EHsc /std:c++17 /utf-8 /DUNICODE /D_UNICODE /Febuild\yMonitory.exe src\main.cpp src\Config.cpp src\SystemMonitor.cpp src\OverlayWindow.cpp build\yMonitory.res /link user32.lib gdi32.lib shell32.lib pdh.lib d2d1.lib dwrite.lib advapi32.lib /SUBSYSTEM:WINDOWS

      - uses: softprops/action-gh-release@v2
        with:
          files: build/yMonitory.exe
          generate_release_notes: true
